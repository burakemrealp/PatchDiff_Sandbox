name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: offline
      AUTO_SYNC_ENABLED: "false"
      DEBUG: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: python -m pytest

  frontend-checks:
    name: Frontend Lint & Build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  repo-hygiene:
    name: Security, Version & Legal Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify clean repository, version parity & legal notices
        run: |
          python - <<'EOF'
          import json
          import re
          import sys
          from pathlib import Path

          # 1. Ensure .env is never tracked or present in CI checkouts
          if Path(".env").exists():
              print("ERROR: .env file must never be committed to the repository.")
              sys.exit(1)

          # 2. Scan checked-out files for accidental credential tokens
          skip_dirs = {".git", ".venv", "node_modules", "dist", "__pycache__", ".pytest_cache"}
          secret_patterns = [
              re.compile(r"gsk_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"RGAPI-[0-9a-fA-F-]{36}"),
          ]
          secret_hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for pat in secret_patterns:
                  if pat.search(text):
                      secret_hits.append(f"{path.as_posix()} ({pat.pattern})")
          if secret_hits:
              print("ERROR: Potential secret tokens detected:", secret_hits)
              sys.exit(1)

          # 3. Verify version parity between frontend/package.json and backend/app/main.py
          pkg_version = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))["version"]
          main_py = Path("backend/app/main.py").read_text(encoding="utf-8")
          match = re.search(r'version\s*=\s*"([^"]+)"', main_py)
          if not match:
              print("ERROR: Could not locate FastAPI app version in backend/app/main.py.")
              sys.exit(1)
          backend_version = match.group(1)
          if pkg_version != backend_version:
              print(f"ERROR: Version mismatch: frontend={pkg_version}, backend={backend_version}")
              sys.exit(1)
          print(f"Verified unified version: {pkg_version}")

          # 4. Verify Riot Games Legal Jibber Jabber notice in required showcase files
          required_legal_files = ["README.md", "README.tr.md", "frontend/src/App.tsx"]
          for rel in required_legal_files:
              content = Path(rel).read_text(encoding="utf-8")
              if "Riot Games, Inc." not in content:
                  print(f"ERROR: Missing Riot Games Legal Jibber Jabber disclaimer in {rel}")
                  sys.exit(1)
          print("Verified Riot Games disclaimer across documentation and UI footer.")
          EOF
