name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Build Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Verify release tag matches project version
        run: |
          python - <<'EOF'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag_name = os.environ["GITHUB_REF_NAME"]
          tag_version = tag_name.removeprefix("v")
          pkg_version = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))["version"]
          main_py = Path("backend/app/main.py").read_text(encoding="utf-8")
          match = re.search(r'version\s*=\s*"([^"]+)"', main_py)
          backend_version = match.group(1) if match else ""

          if not (tag_version == pkg_version == backend_version):
              print(
                  f"ERROR: Version mismatch -> tag={tag_version}, "
                  f"frontend={pkg_version}, backend={backend_version}"
              )
              sys.exit(1)
          print(f"Release version verified: {tag_version}")
          EOF

      - name: Install backend dependencies & run tests
        working-directory: backend
        env:
          LLM_PROVIDER: offline
          AUTO_SYNC_ENABLED: "false"
          DEBUG: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Lint & build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Package release bundle & checksums
        run: |
          mkdir -p dist-release
          tar -czf "dist-release/patchdiff-sandbox-ui-${GITHUB_REF_NAME}.tar.gz" -C frontend/dist .
          (
            cd dist-release
            sha256sum "patchdiff-sandbox-ui-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS.txt
          )

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist-release

      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          tag_name = os.environ["GITHUB_REF_NAME"]
          version = tag_name.removeprefix("v")
          changelog_path = Path("CHANGELOG.md")
          notes = f"# PatchDiff Sandbox {tag_name}\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.\n"

          if changelog_path.exists():
              text = changelog_path.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if match and match.group(1).strip():
                  notes = match.group(1).strip() + "\n"

          Path("release_notes.md").write_text(notes, encoding="utf-8")
          print("Prepared release_notes.md for", tag_name)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist-release/patchdiff-sandbox-ui-${{ github.ref_name }}.tar.gz
            dist-release/SHA256SUMS.txt
